[package]
name = "dsh-connector"
version = "1.0.11"
description = "DSH 远程连接器"
edition = "2021"

[lib]
name = "dsh_connector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
